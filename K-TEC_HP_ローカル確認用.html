<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>株式会社 Kテック｜ローカル確認用</title>
  <meta name="description" content="会社ホームページ" />
  <style>
:root{
  --accent:#1b1b1b;
  --deep:#090909;
  --mid:#464646;
  --ink:#171717;
  --muted:#686868;
  --paper:#ffffff;
  --soft:#f2f2f2;
  --line:#d5d5d5;
  --shadow:0 10px 30px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--paper);padding-bottom:76px;line-height:1.75}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.site-header{height:92px;background:#232323;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.16)}
.brand{display:flex;align-items:center;gap:11px;color:white;min-width:0}.brand-copy{display:flex;flex-direction:column;line-height:1;min-width:0}.brand-copy strong{font-size:clamp(19px,5.2vw,28px);letter-spacing:-.6px;white-space:nowrap}.brand-copy small{font-size:10px;letter-spacing:2.1px;margin-top:6px;color:#cfcfcf;white-space:nowrap}.brand-logo{width:62px;height:62px;object-fit:contain;flex:0 0 auto;border-radius:0;background:#232323}
.menu-btn{width:50px;height:50px;border:1px solid #d7d7d7;border-radius:50%;background:#2c2c2c;display:grid;place-content:center;gap:5px;box-shadow:0 6px 16px rgba(0,0,0,.22);cursor:pointer}.menu-btn span{display:block;width:25px;height:3px;background:white;border-radius:2px;transition:.2s}.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0}.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.drawer{position:fixed;top:0;right:0;width:min(82vw,360px);height:100dvh;background:#fff;z-index:80;padding:110px 28px 40px;transform:translateX(105%);transition:.26s ease;box-shadow:-10px 0 30px rgba(0,0,0,.15)}.drawer.open{transform:none}.drawer a{display:block;padding:15px 4px;border-bottom:1px solid #e5e5e5;font-weight:700}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:.2s}.scrim.open{opacity:1;pointer-events:auto}
.hero{position:relative;background:#090909}.hero img{width:100%;height:41vh;min-height:300px;max-height:560px;object-fit:cover;filter:contrast(1.03) saturate(1.05) brightness(.88)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 25%,rgba(0,0,0,.84) 100%)}.hero-caption{position:absolute;z-index:2;left:7vw;right:7vw;bottom:28px;color:#fff}.hero-caption p{font-size:11px;letter-spacing:2.2px;margin:0 0 8px;opacity:.78}.hero-caption h1{font-size:clamp(27px,7vw,52px);line-height:1.35;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.28)}
.section-pad{padding:56px 22px}.eyebrow{color:#3b3b3b;font-size:12px;font-weight:800;letter-spacing:2.6px;margin:0 0 7px}.eyebrow.light{color:#c9c9c9}.intro h2,.band h2,.services h2,.company h2,.contact h2{font-size:clamp(28px,7vw,42px);line-height:1.35;margin:0}.title-rule{height:2px;background:linear-gradient(90deg,var(--ink) 0 78%,transparent 78%);margin:20px 0 26px}
.problem-list{display:grid;gap:12px}.problem-card{display:grid;grid-template-columns:60px 1fr;align-items:center;min-height:92px;background:linear-gradient(145deg,#fff,#eeeeee);border-left:6px solid #363636;box-shadow:var(--shadow);overflow:hidden}.problem-card span{font-size:12px;color:#444;font-weight:800;letter-spacing:1px;align-self:start;padding:14px 0 0 16px}.problem-card p{font-size:17px;font-weight:700;line-height:1.65;margin:0;padding:15px 16px 15px 0}.lead{color:var(--muted);margin:28px 0 22px}.primary-btn{display:flex;align-items:center;justify-content:space-between;background:#151515;color:white;padding:17px 20px;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.20)}
.band{background:linear-gradient(145deg,#292929,#080808);color:#fff}.strength-grid{display:grid;gap:14px;margin-top:28px}.strength-grid article{padding:24px 20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.17)}.strength-grid b{font-size:12px;color:#cfcfcf}.strength-grid h3{margin:4px 0 7px;font-size:21px}.strength-grid p{margin:0;color:#d8d8d8;font-size:14px}
.service-grid{display:grid;gap:14px;margin-top:26px}.service-grid article{border:1px solid var(--line);padding:24px 20px;background:white}.service-icon{width:48px;height:48px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-weight:900}.service-grid h3{margin:12px 0 3px}.service-grid p{margin:0;color:var(--muted);font-size:14px}
.company{background:var(--soft)}.company dl{margin:26px 0 0}.company dl div{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}.company dl div:last-child{border-bottom:1px solid var(--line)}.company dt{font-weight:700}.company dd{margin:0;color:#4f4f4f;overflow-wrap:anywhere}.note{font-size:12px;color:#777;margin:20px 0 0}
.contact{background:#161616;color:white}.contact p:not(.eyebrow){color:#d7d7d7}.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.contact-actions a{background:#fff;color:#111;padding:15px 10px;text-align:center;font-weight:800}.site-footer{background:#080808;color:#bfbfbf;text-align:center;padding:26px 20px 20px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:linear-gradient(180deg,#202020,#070707);z-index:60;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.18)}.bottom-nav a{color:white;display:grid;place-items:center;align-content:center;gap:2px;border-right:1px solid rgba(255,255,255,.12)}.bottom-nav a:last-child{border-right:0}.nav-icon{font-size:22px;line-height:1}.bottom-nav small{font-size:10px;font-weight:800;letter-spacing:.8px}
@media (min-width:800px){body{padding-bottom:0}.site-header{padding-left:max(40px,calc((100vw - 1180px)/2));padding-right:max(40px,calc((100vw - 1180px)/2));height:104px}.menu-btn{display:none}.drawer{position:static;transform:none;width:auto;height:auto;background:transparent;box-shadow:none;padding:0;display:flex;gap:26px;z-index:51;margin-right:max(40px,calc((100vw - 1180px)/2))}.drawer a{border:0;padding:0;color:white;font-size:14px}.scrim{display:none}.site-header+.drawer{position:fixed;top:0;right:0;height:104px;align-items:center}.hero img{height:620px;max-height:none}.hero-caption{left:max(60px,calc((100vw - 1180px)/2));bottom:68px}.section-pad{max-width:1100px;margin:auto;padding:88px 40px}.problem-list,.strength-grid{grid-template-columns:repeat(3,1fr)}.service-grid{grid-template-columns:repeat(2,1fr)}.problem-card{grid-template-columns:48px 1fr}.contact-actions{max-width:500px}.bottom-nav{display:none}.sp-only{display:none}}

</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="ホームへ">
      <img id="brand-logo" class="brand-logo" src="" alt="" />
      <span class="brand-copy">
        <strong id="brand-main"></strong>
        <small id="brand-sub"></small>
      </span>
    </a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav id="drawer" class="drawer" aria-hidden="true">
    <a href="#top">HOME</a>
    <a href="#strength">会社について</a>
    <a href="#service">事業内容</a>
    <a href="#company">会社案内</a>
    <a href="#contact">お問い合わせ</a>
  </nav>
  <div class="scrim" data-close></div>

  <main id="top">
    <section class="hero">
      <img id="hero-image" src="" alt="" />
      <div class="hero-caption">
        <p id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
      </div>
    </section>

    <section class="intro section-pad">
      <p id="mission-eyebrow" class="eyebrow"></p>
      <h2 id="mission-title"></h2>
      <div class="title-rule"></div>
      <div id="problem-list" class="problem-list"></div>
      <p id="mission-lead" class="lead"></p>
      <a class="primary-btn" href="#strength"><span id="mission-button-text"></span><span>→</span></a>
    </section>

    <section id="strength" class="band">
      <div class="section-pad">
        <p id="strength-eyebrow" class="eyebrow light"></p>
        <h2 id="strength-title"></h2>
        <div id="strength-grid" class="strength-grid"></div>
      </div>
    </section>

    <section id="service" class="section-pad services">
      <p id="service-eyebrow" class="eyebrow"></p>
      <h2 id="service-title"></h2>
      <div id="service-grid" class="service-grid"></div>
    </section>

    <section id="company" class="company section-pad">
      <p id="company-eyebrow" class="eyebrow"></p>
      <h2 id="company-title"></h2>
      <dl id="company-rows"></dl>
      <p id="company-note" class="note"></p>
    </section>

    <section id="contact" class="contact section-pad">
      <p id="contact-eyebrow" class="eyebrow light"></p>
      <h2 id="contact-title"></h2>
      <p id="contact-text"></p>
      <div class="contact-actions">
        <a data-phone-link href="#"><span id="phone-label">電話する</span></a>
        <a data-mail-link href="#">メールする</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small id="footer-copyright"></small>
  </footer>

  <nav class="bottom-nav" aria-label="クイックメニュー">
    <a href="#top"><span class="nav-icon">⌂</span><small>HOME</small></a>
    <a data-phone-link href="#"><span class="nav-icon">☎</span><small>PHONE</small></a>
    <a data-map-link href="#" target="_blank" rel="noopener"><span class="nav-icon">●</span><small>MAP</small></a>
    <a data-mail-link href="#"><span class="nav-icon">✉</span><small>MAIL</small></a>
  </nav>

    title: "工事のご相談・お問い合わせ",
    text: "お問い合わせ方法・受付時間などの文章は確認後に調整します。",
    phoneDisplay: "090-4649-1867",
    phoneLink: "09046491867",
    email: "ibukicom@outlook.jp",
    mapUrl: "https://www.google.com/maps/search/?api=1&query=%E5%85%B5%E5%BA%AB%E7%9C%8C%E5%8A%A0%E5%8F%A4%E5%B7%9D%E5%B8%82%E5%B9%B3%E5%B2%A1%E7%94%BA%E4%B8%80%E8%89%B2755-5"
  },

  footer: {
    copyright: "© K-TEC CO., LTD."
  }
};

</script>
  <script>
(() => {
  const data = window.SITE_DATA;
  if (!data) return;

  const $ = (selector, root = document) => root.querySelector(selector);
  const el = (tag, className) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    return node;
  };
  const setText = (selector, value) => {
    const node = $(selector);
    if (node) node.textContent = value ?? "";
  };
  const appendLines = (node, lines) => {
    node.replaceChildren();
    (lines || []).forEach((line, i) => {
      if (i) node.appendChild(document.createElement("br"));
      node.appendChild(document.createTextNode(line));
    });
  };

  // SEO
  document.title = data.seo?.title || document.title;
  const metaDescription = $('meta[name="description"]');
  if (metaDescription && data.seo?.description) metaDescription.content = data.seo.description;

  // Brand
  setText("#brand-main", data.brand?.main);
  setText("#brand-sub", data.brand?.sub);
  const brandLogo = $("#brand-logo");
  if (brandLogo) {
    brandLogo.src = data.brand?.logo || "";
    brandLogo.alt = data.brand?.main ? `${data.brand.main} ロゴ` : "会社ロゴ";
    brandLogo.hidden = !data.brand?.logo;
  }
  const brand = $(".brand");
  if (brand && data.brand?.ariaLabel) brand.setAttribute("aria-label", data.brand.ariaLabel);

  // Hero
  const heroImage = $("#hero-image");
  if (heroImage) {
    heroImage.src = data.hero?.image || "";
    heroImage.alt = data.hero?.imageAlt || "";
  }
  setText("#hero-eyebrow", data.hero?.eyebrow);
  appendLines($("#hero-title"), data.hero?.titleLines);

  // Mission
  setText("#mission-eyebrow", data.mission?.eyebrow);
  appendLines($("#mission-title"), data.mission?.titleLines);
  const problemList = $("#problem-list");
  if (problemList) {
    problemList.replaceChildren();
    (data.mission?.problems || []).forEach((item) => {
      const article = el("article", "problem-card");
      const number = el("span");
      number.textContent = item.number || "";
      const p = el("p");
      appendLines(p, item.lines);
      article.append(number, p);
      problemList.appendChild(article);
    });
  }
  appendLines($("#mission-lead"), data.mission?.leadLines);
  setText("#mission-button-text", data.mission?.buttonText);

  // Strengths
  setText("#strength-eyebrow", data.strengths?.eyebrow);
  setText("#strength-title", data.strengths?.title);
  const strengthGrid = $("#strength-grid");
  if (strengthGrid) {
    strengthGrid.replaceChildren();
    (data.strengths?.items || []).forEach((item) => {
      const article = el("article");
      const b = el("b"); b.textContent = item.number || "";
      const h3 = el("h3"); h3.textContent = item.title || "";
      const p = el("p"); p.textContent = item.text || "";
      article.append(b, h3, p);
      strengthGrid.appendChild(article);
    });
  }

  // Services
  setText("#service-eyebrow", data.services?.eyebrow);
  setText("#service-title", data.services?.title);
  const serviceGrid = $("#service-grid");
  if (serviceGrid) {
    serviceGrid.replaceChildren();
    (data.services?.items || []).forEach((item) => {
      const article = el("article");
      const icon = el("div", "service-icon"); icon.textContent = item.icon || "";
      const h3 = el("h3"); h3.textContent = item.title || "";
      const p = el("p"); p.textContent = item.text || "";
      article.append(icon, h3, p);
      serviceGrid.appendChild(article);
    });
  }

  // Company
  setText("#company-eyebrow", data.company?.eyebrow);
  setText("#company-title", data.company?.title);
  const companyRows = $("#company-rows");
  if (companyRows) {
    companyRows.replaceChildren();
    (data.company?.rows || []).forEach(([label, value]) => {
      const wrap = el("div");
      const dt = el("dt"); dt.textContent = label || "";
      const dd = el("dd"); dd.textContent = value || "";
      wrap.append(dt, dd);
      companyRows.appendChild(wrap);
    });
  }
  setText("#company-note", data.company?.note);

  // Contact + quick links
  setText("#contact-eyebrow", data.contact?.eyebrow);
  setText("#contact-title", data.contact?.title);
  setText("#contact-text", data.contact?.text);
  setText("#phone-label", data.contact?.phoneDisplay || "電話する");

  document.querySelectorAll("[data-phone-link]").forEach((a) => {
    a.href = `tel:${data.contact?.phoneLink || ""}`;
  });
  document.querySelectorAll("[data-mail-link]").forEach((a) => {
    a.href = `mailto:${data.contact?.email || ""}`;
  });
  document.querySelectorAll("[data-map-link]").forEach((a) => {
    a.href = data.contact?.mapUrl || "#";
  });

  setText("#footer-copyright", data.footer?.copyright);

  // Drawer menu
  const btn = $(".menu-btn");
  const drawer = $(".drawer");
  const scrim = $(".scrim");
  function setMenu(open) {
    if (!btn || !drawer || !scrim) return;
    btn.setAttribute("aria-expanded", String(open));
    drawer.classList.toggle("open", open);
    drawer.setAttribute("aria-hidden", String(!open));
    scrim.classList.toggle("open", open);
    document.body.style.overflow = open ? "hidden" : "";
  }
  btn?.addEventListener("click", () => setMenu(btn.getAttribute("aria-expanded") !== "true"));
  scrim?.addEventListener("click", () => setMenu(false));
  drawer?.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => setMenu(false)));
})();

</script>
</body>
</html>
