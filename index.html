<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>会社ホームページ</title>
  <meta name="description" content="会社ホームページ" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="ホームへ">
      <img id="brand-logo" class="brand-logo" src="" alt="" />
      <span class="brand-copy">
        <strong id="brand-main"></strong>
        <small id="brand-sub"></small>
      </span>
    </a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav id="drawer" class="drawer" aria-hidden="true">
    <a href="./">HOME</a>
    <a href="#news">お知らせ</a>
    <a href="#strength">会社について</a>
    <a href="#service">事業内容</a>
    <a href="#company">会社案内</a>
    <a href="#contact">お問い合わせ</a>
  </nav>
  <div class="scrim" data-close></div>

  <main id="top">
    <section class="hero">
      <img id="hero-image" src="" alt="" />
      <div class="hero-caption">
        <p id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
      </div>
    </section>

    <section class="intro section-pad">
      <p id="mission-eyebrow" class="eyebrow"></p>
      <h2 id="mission-title"></h2>
      <div class="title-rule"></div>
      <div id="problem-list" class="problem-list"></div>
      <p id="mission-lead" class="lead"></p>
    </section>

    <section id="news" class="news section-pad">
      <p id="news-eyebrow" class="eyebrow"></p>
      <h2 id="news-title"></h2>
      <div id="news-list" class="news-list"></div>
    </section>

    <section id="strength" class="band">
      <div class="section-pad">
        <p id="strength-eyebrow" class="eyebrow light"></p>
        <h2 id="strength-title"></h2>
        <div id="strength-grid" class="strength-grid"></div>
      </div>
    </section>

    <section id="service" class="section-pad services">
      <p id="service-eyebrow" class="eyebrow"></p>
      <h2 id="service-title"></h2>
      <div id="service-grid" class="service-grid"></div>
    </section>

    <section id="company" class="company section-pad">
      <p id="company-eyebrow" class="eyebrow"></p>
      <h2 id="company-title"></h2>
      <dl id="company-rows"></dl>
      <p id="company-note" class="note"></p>
    </section>

    <section id="contact" class="contact section-pad">
      <p id="contact-eyebrow" class="eyebrow light"></p>
      <h2 id="contact-title"></h2>
      <p id="contact-text"></p>
      <div class="contact-actions">
        <a data-phone-link href="#"><span id="phone-label">電話する</span></a>
        <a data-mail-link href="#">メールする</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small id="footer-copyright"></small>
  </footer>

  <nav class="bottom-nav" aria-label="クイックメニュー">
    <a href="./"><span class="nav-icon">⌂</span><small>HOME</small></a>
    <a data-phone-link href="#"><span class="nav-icon">☎</span><small>PHONE</small></a>
    <a data-map-link href="#" target="_blank" rel="noopener"><span class="nav-icon">●</span><small>MAP</small></a>
    <a data-mail-link href="#"><span class="nav-icon">✉</span><small>MAIL</small></a>
  </nav>

  <script src="site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
